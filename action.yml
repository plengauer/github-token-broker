name: GitHub Token Broker
description: Exchange the workflow's GitHub OIDC token for a short-lived, single-repository GitHub App installation token issued by a github-token-broker deployment.
inputs:
  url:
    description: Base URL of the github-token-broker (also used as the OIDC audience).
    required: true
outputs:
  token:
    description: The GitHub App installation token, scoped to the current repository and valid for one hour.
    value: ${{ steps.exchange.outputs.token }}
runs:
  using: composite
  steps:
    - id: exchange
      shell: bash
      env:
        BROKER_URL: ${{ inputs.url }}
      run: |
        set -e
        [ -n "$BROKER_URL" ] || { echo "::error::broker url is empty (is the TOKEN_BROKER_URL variable set?)"; exit 1; }
        [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || { echo "::error::missing OIDC context, the job needs 'permissions: id-token: write'"; exit 1; }
        oidc_jwt="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$BROKER_URL" | sed -n 's/.*"value": *"\([^"]*\)".*/\1/p')"
        [ -n "$oidc_jwt" ]
        echo "::add-mask::$oidc_jwt"
        token="$(OTEL_PROPAGATORS=tracecontext,b3,baggage curl -sSf -X POST "$BROKER_URL/token" -H "Authorization: Bearer $oidc_jwt" | sed -n 's/.*"token": *"\([^"]*\)".*/\1/p')"
        [ -n "$token" ]
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"
