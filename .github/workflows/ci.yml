name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: pip install -r requirements.txt pytest && pytest -q tests
        env:
          PYTHONPATH: .
      - run: docker build -t github-token-broker:latest .
      - run: |
          GH_TOKEN=${{ secrets.ACTIONS_GITHUB_TOKEN || github.token }} gh release create v"$(cat VERSION)" --title v"$(cat VERSION)" --target ${{ github.sha }} --generate-notes
